name: Build Windows Desktop (portable)

on:
  push:
    branches:
      - generate-installers
  # Manual "Run workflow" from the Actions tab. Without this trigger GitHub
  # hides the button entirely, which is why the workflow looked unrunnable.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dorg.gradle.vfs.watch=false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        shell: bash

      # Windows ships as a single amd64 portable build: the jpackage app-image
      # zipped with its bundled JRE. No EXE/MSI installers and no SignPath step.
      - name: Build Windows portable app-image (amd64)
        run: |
          set -euo pipefail
          retry() {
            local n=1 max=3 delay=5
            while true; do
              echo "Attempt #$n: $*"
              "$@" && break
              [ $n -ge $max ] && { echo "Failed after $n attempts."; return 1; }
              n=$((n+1)); echo "Retrying in ${delay}s..."; sleep $delay; delay=$((delay*2))
            done
          }
          retry ./gradlew :composeApp:createDistributable
        shell: bash

      # Portable build: zip the jpackage app-image (launcher + bundled JRE) so
      # users can unzip and run Komi-Store.exe with no installer (#700). This is
      # the only Windows artifact we ship; the launcher is unsigned.
      - name: Stage Windows portable (zip app-image)
        shell: pwsh
        run: |
          $line = (Select-String -Path 'gradle.properties' -Pattern '^projectVersionName\s*=' | Select-Object -First 1).Line
          $version = ($line -split '=')[1].Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { Write-Error "Could not read projectVersionName"; exit 1 }
          $appDir = "composeApp/build/compose/binaries/main/app/Komi-Store"
          if (-not (Test-Path $appDir)) { $appDir = "composeApp/build/compose/binaries/main/app-image/Komi-Store" }
          if (-not (Test-Path $appDir)) { Write-Error "app-image directory not found"; exit 1 }
          New-Item -ItemType Directory -Force -Path windows-portable | Out-Null
          $zip = "windows-portable/Komi-Store-$version-windows-x64-portable.zip"
          Compress-Archive -Path $appDir -DestinationPath $zip -Force
          Get-Item $zip | Format-List

      - name: Upload Windows portable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-portable
          path: windows-portable/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Draft release with the Windows portable build
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read project version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep '^projectVersionName' gradle.properties | head -1 | sed 's/.*= *//')
          if [ -z "$VERSION" ]; then
            echo "ERROR: could not read projectVersionName from gradle.properties"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: v$VERSION"
        shell: bash

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Stage the Windows portable zip
        run: |
          set -euo pipefail
          mkdir -p release-files

          echo "=== Downloaded artifact tree ==="
          find artifacts -maxdepth 4 -type f 2>/dev/null | sort
          echo

          count=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            cp "$f" "release-files/$(basename "$f")"
            echo "Staged: $(basename "$f")"
            count=$((count + 1))
          done < <(find artifacts/windows-portable -type f -name '*.zip' 2>/dev/null)

          # Completeness guard: a build regression must not ship an empty release.
          if [ "$count" -eq 0 ]; then
            echo "ERROR: no Windows portable zip was produced; refusing to publish."
            exit 1
          fi

          ls -la release-files/
        shell: bash

      - name: Create or update draft release
        env:
          GH_TOKEN: ${ secrets.GITHUB_TOKEN }
          TAG: ${ steps.version.outputs.tag }
          VERSION: ${ steps.version.outputs.version }
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Only clobber assets while the release is still a DRAFT; never
            # silently overwrite a published release.
            is_draft=$(gh release view "$TAG" --json isDraft -q '.isDraft')
            if [ "$is_draft" = "true" ]; then
              echo "Draft release $TAG already exists — replacing assets via --clobber..."
              gh release upload "$TAG" release-files/* --clobber
            else
              echo "ERROR: release $TAG is already PUBLISHED."
              echo "Refusing to clobber published assets."
              echo
              echo "If you intended to ship a new version, bump"
              echo "projectVersionName in gradle.properties first,"
              echo "then re-run the workflow."
              exit 1
            fi
          else
            echo "Creating new draft release $TAG..."
            gh release create "$TAG" \
              --draft \
              --title "$VERSION" \
              --generate-notes \
              release-files/*
          fi
        shell: bash
